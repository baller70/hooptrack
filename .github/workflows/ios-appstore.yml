name: iOS App Store

# Archives and ships the iOS apps from a GitHub-hosted macOS runner, which has
# Xcode preinstalled. This is how the apps reach App Store Connect without a
# local Mac — Linux agents and containers cannot run Xcode at all.
#
# Two ways in. workflow_dispatch, where "upload" is not the default so a stray
# click cannot ship a build. And a release tag, for callers that cannot reach
# the dispatch API — pushing `release-both-6` releases both apps at build 6 and
# submits them. Creating that tag is deliberate enough to be the consent.

on:
  push:
    tags: ['release-*']
  workflow_dispatch:
    inputs:
      app:
        description: Which app to release
        required: true
        default: both
        type: choice
        options: [coach, player, both]
      build_number:
        description: Build number (CFBundleVersion) — must exceed the last upload
        required: true
        type: string
      stage:
        description: How far to go
        required: true
        default: validate
        type: choice
        options: [archive, validate, upload, upload-and-submit]
      xcode_version:
        description: Xcode version to select (blank = runner default)
        required: false
        type: string

concurrency:
  group: ios-appstore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Normalises the two entry points into one set of values, so the release job
  # does not care which one fired it.
  config:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.resolve.outputs.app }}
      build_number: ${{ steps.resolve.outputs.build_number }}
      stage: ${{ steps.resolve.outputs.stage }}
    steps:
      - name: Resolve release parameters
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
            # release-<coach|player|both>-<build number>
            if [[ ! "$tag" =~ ^release-(coach|player|both)-([0-9]+)$ ]]; then
              echo "::error::Tag '$tag' must look like release-both-6 (app: coach, player, or both)." >&2
              exit 1
            fi
            echo "app=${BASH_REMATCH[1]}"          >> "$GITHUB_OUTPUT"
            echo "build_number=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "stage=upload-and-submit"         >> "$GITHUB_OUTPUT"
            echo "Tag release: ${BASH_REMATCH[1]} build ${BASH_REMATCH[2]} -> upload-and-submit"
          else
            echo "app=${{ inputs.app }}"                   >> "$GITHUB_OUTPUT"
            echo "build_number=${{ inputs.build_number }}" >> "$GITHUB_OUTPUT"
            echo "stage=${{ inputs.stage }}"               >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release secrets are configured
        env:
          HAS_CERT: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 != '' }}
          HAS_P8: ${{ secrets.ASC_KEY_P8_BASE64 != '' }}
        run: |
          if [ "$HAS_CERT" != "true" ] || [ "$HAS_P8" != "true" ]; then
            echo "::error::Release secrets are missing. Run the iOS Release Preflight workflow to see which." >&2
            exit 1
          fi

  release:
    needs: config
    runs-on: macos-15
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        app: ${{ needs.config.outputs.app == 'both' && fromJSON('["coach","player"]') || fromJSON(format('["{0}"]', needs.config.outputs.app)) }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -n "${{ github.event.inputs.xcode_version }}" ]; then
            sudo xcode-select -s "/Applications/Xcode_${{ github.event.inputs.xcode_version }}.app"
          fi
          xcodebuild -version

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12_BASE64}" ]; then
            echo "::error::APPLE_DIST_CERT_P12_BASE64 is not set. See docs/APP_STORE_SUBMISSION.md." >&2
            exit 1
          fi

          keychain="${RUNNER_TEMP}/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          cert_path="${RUNNER_TEMP}/dist.p12"

          printf '%s' "${CERT_P12_BASE64}" | base64 --decode > "${cert_path}"

          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${cert_path}" -P "${CERT_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain}"
          security set-key-partition-list -S apple-tool:,apple: -k "${keychain_password}" "${keychain}" >/dev/null
          security list-keychain -d user -s "${keychain}" login.keychain-db

          rm -f "${cert_path}"
          security find-identity -v -p codesigning "${keychain}"

      - name: Install App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_KEY_ID}" ] || [ -z "${ASC_KEY_P8_BASE64}" ]; then
            echo "::error::ASC_KEY_ID / ASC_KEY_P8_BASE64 are not set. See docs/APP_STORE_SUBMISSION.md." >&2
            exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "${ASC_KEY_P8_BASE64}" | base64 --decode > ~/.appstoreconnect/private_keys/"AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 ~/.appstoreconnect/private_keys/"AuthKey_${ASC_KEY_ID}.p8"

      - name: Release ${{ matrix.app }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          case "${{ needs.config.outputs.stage }}" in
            archive)
              ./scripts/appstore-release.sh "${{ matrix.app }}" archive --build "${{ needs.config.outputs.build_number }}"
              ./scripts/appstore-release.sh "${{ matrix.app }}" export
              ;;
            validate)
              ./scripts/appstore-release.sh "${{ matrix.app }}" archive --build "${{ needs.config.outputs.build_number }}"
              ./scripts/appstore-release.sh "${{ matrix.app }}" export
              ./scripts/appstore-release.sh "${{ matrix.app }}" validate
              ;;
            upload|upload-and-submit)
              ./scripts/appstore-release.sh "${{ matrix.app }}" all --build "${{ needs.config.outputs.build_number }}"
              ;;
          esac

      # Uploading only puts the binary in App Store Connect. Apple still has to
      # finish processing it before it can be attached to a version, so this
      # waits rather than failing on a build that simply is not ready yet.
      - name: Submit ${{ matrix.app }} for review
        if: needs.config.outputs.stage == 'upload-and-submit'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          # Only jose is needed here; a full install would compile
          # better-sqlite3 natively for nothing.
          npm install --no-save --no-audit --no-fund jose
          export ASC_KEY_PATH="${HOME}/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          for attempt in $(seq 1 20); do
            if node scripts/appstore-submit-for-review.mjs "${{ matrix.app }}" \
                 --build "${{ needs.config.outputs.build_number }}" --submit; then
              exit 0
            fi
            echo "Build not ready yet (attempt ${attempt}/20); waiting 90s..."
            sleep 90
          done
          echo "::error::Build ${{ needs.config.outputs.build_number }} did not finish processing within 30 minutes." >&2
          exit 1

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-ipa-build-${{ needs.config.outputs.build_number }}
          path: build/appstore/${{ matrix.app }}/export/*.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Collect build logs on failure
        if: failure()
        run: |
          echo "Archive contents, if any:"
          ls -la "build/appstore/${{ matrix.app }}" 2>/dev/null || echo "(no build directory)"

      - name: Remove signing keychain
        if: always()
        run: |
          security delete-keychain "${RUNNER_TEMP}/signing.keychain-db" 2>/dev/null || true
          rm -f ~/.appstoreconnect/private_keys/*.p8 2>/dev/null || true
